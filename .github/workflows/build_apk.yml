name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Locate Project Root
        id: locate
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -print -quit)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Could not find pubspec.yaml"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Regenerate Android Platform
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          rm -rf android
          flutter create --platforms=android --org com.callmind.app .

      - name: Get Flutter Dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter build apk --release

      - name: Prepare APK Artifact
        run: |
          PROJECT_DIR="${{ steps.locate.outputs.dir }}"
          mkdir -p output_apk
          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" output_apk/CallMind-release.apk

      - name: Upload APK Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: CallMind-release-apk
          path: output_apk/CallMind-release.apk
