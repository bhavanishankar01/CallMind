name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-Detect Project, Configure Kotlin & Build APK
        run: |
          # 1. Locate directory containing pubspec.yaml
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -print -quit)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: Could not find pubspec.yaml in repository!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "=================================================="
          echo "Found Flutter Project Root at: $PROJECT_DIR"
          echo "=================================================="
          
          cd "$PROJECT_DIR"
          
          # 2. Remove legacy Android directory to prevent Gradle version mismatch
          rm -rf android
          
          # 3. Regenerate Android platform files
          flutter create --platforms=android --org com.callmind.app .
          
          # 4. Inject Kotlin Plugin into settings.gradle.kts to fix project ':jni' method evaluation
          cat << 'EOF' > android/settings.gradle.kts
pluginManagement {
    val flutterSdkPath = run {
        val properties = java.util.Properties()
        val localPropertiesFile = java.io.File(rootDir, "local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.reader(Charsets.UTF_8).use { reader -> properties.load(reader) }
        }
        val flutterSdkPath = properties.getProperty("flutter.sdk")
        assert(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
        flutterSdkPath
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("dev.flutter.flutter-plugin-loader") version "1.0.0"
    id("com.android.application") version "8.3.2" apply false
    id("org.jetbrains.kotlin.android") version "1.9.24" apply false
}

include(":app")
EOF

          # 5. Get dependencies
          flutter pub get
          
          # 6. Compile Release APK
          flutter build apk --release
          
          # 7. Copy generated APK to root build artifacts folder
          mkdir -p $GITHUB_WORKSPACE/output_apk
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output_apk/CallMind-release.apk

      - name: Upload APK Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: CallMind-release-apk
          path: output_apk/CallMind-release.apk
