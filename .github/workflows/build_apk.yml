name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-Detect Project, Regenerate Modern Android & Build APK
        run: |
          # 1. Locate directory containing pubspec.yaml
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -print -quit)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: Could not find pubspec.yaml in repository!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "=================================================="
          echo "Found Flutter Project Root at: $PROJECT_DIR"
          echo "=================================================="
          
          cd "$PROJECT_DIR"
          
          # 2. Remove legacy Android directory to prevent Gradle version mismatch
          rm -rf android
          
          # 3. Regenerate modern SDK-matching Android platform files
          flutter create --platforms=android --org com.callmind.app .
          
          # 4. Get dependencies
          flutter pub get
          
          # 5. Compile Release APK
          flutter build apk --release
          
          # 6. Copy generated APK to root build artifacts folder
          mkdir -p $GITHUB_WORKSPACE/output_apk
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output_apk/CallMind-release.apk

      - name: Upload APK Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: CallMind-release-apk
          path: output_apk/CallMind-release.apk
